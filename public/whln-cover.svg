<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="WHLN cover">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="58%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="smoke" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <ellipse cx="500" cy="160" rx="420" ry="190" fill="url(#smoke)"/>
  <rect x="438" y="180" width="124" height="430" rx="55" fill="#7a7a7a" opacity="0.45"/>
  <circle cx="500" cy="130" r="86" fill="#898989" opacity="0.52"/>

  <text x="500" y="700" text-anchor="middle" font-size="320" font-family="Arial Black, Impact, sans-serif" fill="#f6f6f6" filter="url(#glow)">WHLN</text>
  <rect x="52" y="886" width="118" height="68" fill="#101010" stroke="#dedede" stroke-width="1"/>
  <text x="111" y="914" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#e9e9e9">PARENTAL</text>
  <text x="111" y="934" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#e9e9e9">ADVISORY</text>
</svg>
